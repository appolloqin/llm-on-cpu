# Qwen3.6-35B-A3B (MoE) INT4 / QLWC — hybrid GDN+GQA + sparse FFN
# Served by Qwen36MoeInt4Model (isolated from dense Qwen3.5 awq_sym zp=7).
# MoE: GPU fused top-k experts by default (pin attn/shared; expert LRU). LLMOC_MOE_GPU_EXPERTS=0 → host.
# AutoAWQ (zero_point:true): import must write scheme=gptq. If log shows awq_sym_zp7, re-import.
#
# node tools/import_awq_hf_qlwc.mjs --src models/Qwen3.6-35B-A3B-AWQ-4bit-hf --out models/Qwen3.6-35B-A3B-AWQ-4bit.int4.qlwc
# .\build\bin\Release\llmoc_server_int4.exe --config configs\engine_int4_qwen3_6a3b.yaml

model:
  path: models/Qwen3.6-35B-A3B-AWQ-4bit.int4.qlwc
  dtype: int4
  mtp: false
  tokenizer_dir: models/Qwen3.6-35B-A3B-AWQ-4bit-hf

# MoE weights are large; prefer hybrid_gpu or layer_stream if DRAM is tight.
mode: hybrid_gpu

moe:
  backend: hybrid          # offload | hybrid | cpu
  cache_slots: 0           # 0 = auto from VRAM after MoE-first reserve
  host_pin: true
  prefill_overlap: true
  hybrid_fetch_frac: 0.5

layer_stream:
  window_layers: 2
  device: cpu
  max_window_mb: 0
  auto: true

tiers:
  dram_hot_gb: 24
  kv_pool_gb: 2
  prefetch_buf_gb: 1
  gpu_vram_gb: 20

decode:
  spec_k: 0
  max_seq: 4096
  max_new_tokens: 1024

io:
  workers: 2

server:
  port: 15085
  api_key_env: LLMOC_API_KEY
