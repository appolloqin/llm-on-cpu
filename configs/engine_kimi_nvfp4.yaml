# Kimi-K3 stub — NVFP4 experts (llmoc_server_kimi_nvfp4)
# (replaces engine_kimi_hybrid.yaml as default quant-locked entry)
model:
  path: models/fake_kimi.kimiq
  dtype: nvfp4
  tokenizer_dir: models/Qwen3.5-4B-hf

mode: hybrid_gpu

tiers:
  dram_hot_gb: 8
  kv_pool_gb: 2
  gpu_vram_gb: 8

server:
  port: 15087
  api_key_env: LLMOC_API_KEY

decode:
  max_new_tokens: 256
