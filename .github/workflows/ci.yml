# llm-on-cpu :: build + package (Windows / Linux / macOS) + source archive
name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Make source archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            export PKG_VER="${GITHUB_REF_NAME}"
          else
            export PKG_VER="$(git rev-parse --short HEAD)"
          fi
          bash scripts/package_source.sh
          ls -lh dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: llm-on-cpu-src
          path: dist/llm-on-cpu-*-src.zip
          if-no-files-found: error

  build:
    name: Build (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            id: linux-x64
          - os: windows-2022
            id: windows-x64
          - os: macos-14
            id: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build liburing-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja libomp
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja -y

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure & build
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            EXTRA+=("-DOpenMP_ROOT=${OpenMP_ROOT}")
            EXTRA+=("-DCMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}")
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "${EXTRA[@]}"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Package application
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            export PKG_VER="${GITHUB_REF_NAME}"
          else
            export PKG_VER="$(git rev-parse --short HEAD)"
          fi
          export BUILD_DIR=build
          export PLATFORM_ID="${{ matrix.id }}"
          bash scripts/package_app.sh
          ls -lh dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: llm-on-cpu-${{ matrix.id }}
          path: dist/llm-on-cpu-*-${{ matrix.id }}.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [source, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name '*.zip' -exec cp -v {} release-assets/ \;
          ls -lh release-assets/
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
