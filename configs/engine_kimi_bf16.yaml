# Kimi-K3 stub — BF16 experts (llmoc_server_kimi_bf16)
model:
  path: models/fake_kimi.kimiq
  dtype: bf16
  tokenizer_dir: models/Qwen3.5-4B-hf

thinking:
  enable: false
  off_style: family

mode: hybrid_gpu

tiers:
  dram_hot_gb: 8
  kv_pool_gb: 2
  gpu_vram_gb: 8

server:
  port: 15087
  api_key_env: LLMOC_API_KEY

decode:
  max_new_tokens: 256
