# INT4/QLWC 专用配置（不影响 configs/engine.yaml BF16 路径）
# 执行模式说明同 configs/engine.yaml（pure_cpu | hybrid_gpu | pure_gpu）
model:
  path: models/Qwen3.5-4B.int4.qlwc
  dtype: int4
  # auto：有 MTP 权重时 INT4/CPU 仍走 greedy（HX bench 更快）；强制开：true 或 LLMOC_MTP=1
  mtp: auto
  # tokenizer_dir 默认由 path 推: models/Qwen3.5-4B.int4-hf —— 请显式指定原 HF 旁路:
  tokenizer_dir: models/Qwen3.5-4B-hf

# pure_cpu（默认）| hybrid_gpu / pure_gpu / auto
# INT4 核始终在 CPU。HX 上 OMP=8/16 ≈10 tok/s；OMP=12/24 会掉到 ~5 tok/s（勿手动设 12）
# 未设 OMP_NUM_THREADS 时 server 自动 cap 到 8；勿设 32（start_int4 已改为 8）
# 笔记本长跑会因散热在 ~5 与 ~10 tok/s 间波动；验收用 bench_decode_tps --new 256 --warm 1
mode: pure_cpu
tiers:
  dram_hot_gb: 6
  kv_pool_gb: 1
  prefetch_buf_gb: 0.5
  # gpu_vram_gb: 16

decode:
  spec_k: 3
  # 单次回复最多新生成 token（≠ 模型 256K 上下文窗口）
  max_new_tokens: 204800

io:
  workers: 2

server:
  port: 15085
  api_key_env: LLMOC_API_KEY
