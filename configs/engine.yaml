# llm-on-cpu 引擎配置 (M4/M5 llmoc_server 读取)
# 完整模式设计见 docs/ARCHITECTURE.md §3.1 · 使用说明 docs/USAGE.md

model:
  path: models/Qwen3.5-4B.lwc
  dtype: bf16
  # false：默认 greedy。MTP 在 CPU 上暂无净收益（见 docs/BENCH_BASELINE.md）
  mtp: false
  # tokenizer_dir: models/Qwen3.5-4B-hf   # 默认由 path 推 *-hf/

# ---------------------------------------------------------------------------
# 执行模式 mode（加载期确定）
#
#   pure_cpu     ① 纯 CPU（默认）。不初始化 CUDA；gemm 全走 CPU。
#   hybrid_gpu   ② 需 CUDA。attn 等 BF16 Linear 可走 cuBLAS；专家仍 CPU/NVMe。
#                无 CUDA 时降级 pure_cpu 并打日志。
#   pure_gpu     ③ 需 CUDA；无卡则启动失败（不静默降级）。
#   auto         有 CUDA → hybrid_gpu，否则 pure_cpu。
# ---------------------------------------------------------------------------
mode: pure_cpu

# 引擎内单机多卡（G8）。省略 = 单卡 [0]。多卡需 NCCL（见实现文档）。
# devices:
#   ids: [0, 1]
#   strategy: auto   # MoE→ep，稠密→tp
#   nccl: true

tiers:
  dram_hot_gb: 16
  kv_pool_gb: 2
  prefetch_buf_gb: 1
  # hybrid_gpu / pure_gpu 显存预算（GB，按每卡）；未设时默认 8
  # gpu_vram_gb: 8
  # pure_gpu:
  #   expert_slot_extra: 1
  #   strict_vram: true
  #   margin_mb: 512

decode:
  spec_k: 3
  accept_min: 2.0
  max_new_tokens: 204800

io:
  engine: auto
  workers: 2

rebalance:
  interval_s: 5

server:
  port: 15085
  api_key_env: LLMOC_API_KEY
