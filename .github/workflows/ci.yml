# llm-on-cpu :: build + package (Windows / Linux / macOS) + source archive
# push 到 main/master（或 workflow_dispatch）→ 自动 bump patch 并发布 GitHub Release
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Version
    runs-on: ubuntu-22.04
    outputs:
      pkg_ver: ${{ steps.ver.outputs.pkg_ver }}
      tag: ${{ steps.ver.outputs.tag }}
      do_release: ${{ steps.ver.outputs.do_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ver
        name: Resolve package version
        shell: bash
        run: |
          set -euo pipefail
          short="$(git rev-parse --short HEAD)"
          on_trunk=false
          if [[ "${GITHUB_REF}" == refs/heads/main || "${GITHUB_REF}" == refs/heads/master ]]; then
            on_trunk=true
          fi
          if [[ "$on_trunk" == true ]] && \
             [[ "${GITHUB_EVENT_NAME}" == push || "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            git fetch --tags --force
            latest="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1 || true)"
            if [[ -z "${latest}" ]]; then
              next="v0.1.0"
            else
              ver="${latest#v}"
              IFS=. read -r maj min pat <<< "${ver}"
              maj="${maj:-0}"; min="${min:-0}"; pat="${pat:-0}"
              pat=$((10#${pat} + 1))
              next="v${maj}.${min}.${pat}"
            fi
            echo "pkg_ver=${next}" >> "$GITHUB_OUTPUT"
            echo "tag=${next}" >> "$GITHUB_OUTPUT"
            echo "do_release=true" >> "$GITHUB_OUTPUT"
            echo "Release version: ${next} (prev=${latest:-none})"
          else
            echo "pkg_ver=${short}" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "PR/non-trunk build version: ${short}"
          fi

  source:
    name: Source package
    needs: [prepare]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Make source archive
        shell: bash
        env:
          PKG_VER: ${{ needs.prepare.outputs.pkg_ver }}
        run: |
          set -euo pipefail
          bash scripts/package_source.sh
          ls -lh dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: llm-on-cpu-src
          path: dist/llm-on-cpu-*-src.zip
          if-no-files-found: error

  build:
    name: Build (${{ matrix.id }})
    needs: [prepare]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            id: linux-x64
          - os: windows-2022
            id: windows-x64
          - os: macos-14
            id: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build liburing-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja libomp
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja -y

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure & build
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            EXTRA+=("-DOpenMP_ROOT=${OpenMP_ROOT}")
            EXTRA+=("-DCMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}")
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "${EXTRA[@]}"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Package application
        shell: bash
        env:
          PKG_VER: ${{ needs.prepare.outputs.pkg_ver }}
          BUILD_DIR: build
          PLATFORM_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          bash scripts/package_app.sh
          ls -lh dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: llm-on-cpu-${{ matrix.id }}
          path: dist/llm-on-cpu-*-${{ matrix.id }}.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [prepare, source, build]
    if: needs.prepare.outputs.do_release == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -name '*.zip' -exec cp -v {} release-assets/ \;
          ls -lh release-assets/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
