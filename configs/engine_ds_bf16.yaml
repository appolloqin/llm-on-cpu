# DeepSeek-V4 stub — BF16 experts (llmoc_server_ds_bf16)
model:
  path: models/fake_ds.dskq
  dtype: bf16
  tokenizer_dir: models/Qwen3.5-4B-hf

mode: hybrid_gpu

tiers:
  dram_hot_gb: 4
  kv_pool_gb: 1
