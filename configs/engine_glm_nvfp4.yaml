# GLM-5.3-Flash — NVFP4（默认；模型 ID: LibertAIDAI/GLM-5.3-Flash-NVFP4）
# download_glm.cmd → 只下该 ID（ModelScope / hf-mirror / hf 用同一 ID）
model:
  path: models/GLM-5.3-Flash.nvfp4.glmq
  dtype: nvfp4
  arch: glm53_flash
  tokenizer_dir: models/GLM-5.3-Flash-NVFP4

# pure_cpu | hybrid_gpu | pure_gpu（实现文档 2026-08-31：pure_gpu=激活路径 GPU + 专家槽）
# 单卡 ~22G：NVFP4 可试 pure_gpu；多卡见 devices:
# devices:
#   ids: [0, 1]
#   strategy: auto
mode: hybrid_gpu

quant: nvfp4

tiers:
  dram_hot_gb: 40
  gpu_vram_gb: 20   # hybrid_gpu / pure_gpu 显存预算（GB）
  kv_pool_gb: 2
  prefetch_buf_gb: 4

decode:
  max_seq: 16384
  max_new_tokens: 2048

io:
  workers: 4

server:
  port: 15085
  api_key_env: LLMOC_API_KEY
